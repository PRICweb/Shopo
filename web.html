<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda en Línea</title>
    <style>
        /* ===== ESTILOS ELEGANTES - TEMA CLARO ===== */
        :root {
            --primary: #5d4037; 
            --primary-hover: #4e342e; 
            --accent: #8d6e63; 
            --bg-color: #f5f5f7; 
            --card-bg: #ffffff; 
            --card-hover: #f9f9f9; 
            --border: #e0e0e0; 
            --border-light: #eeeeee; 
            --text-main: #212121; 
            --text-muted: #616161; 
            --text-dark: #9e9e9e;
        }
        
        * { box-sizing: border-box; } 
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background-color: var(--bg-color); color: var(--text-main); letter-spacing: 0.3px; }
        .hidden { display: none !important; } 
        
        button { background-color: var(--primary); color: #ffffff; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s; } 
        button:hover { background-color: var(--primary-hover); } 
        button:disabled { background-color: var(--border); color: var(--text-dark); cursor: not-allowed; } 
        button.secondary { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); } 
        button.secondary:hover { background-color: var(--card-hover); } 
        button.outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-muted); } 
        button.danger { background-color: transparent; border: 1px solid var(--border); color: var(--text-muted); } 
        
        .filtros-scroll { display: flex; gap: 12px; margin-bottom: 25px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; } 
        .filtros-scroll::-webkit-scrollbar { display: none; } 
        .btn-categoria { background-color: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 18px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; white-space: nowrap; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s;} 
        .btn-categoria:hover { border-color: var(--accent); color: var(--text-main); }
        .btn-categoria.active { background-color: var(--primary); color: #fff; border-color: var(--primary); } 
        
        .btn-flotante-wsp { position: fixed; bottom: 30px; right: 30px; background-color: #25D366; color: #fff; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 999; padding: 0; } 
        .btn-flotante-wsp:hover { transform: scale(1.1); background-color: #20bd5a; }
        
        .container { background: transparent; padding: 0; max-width: 1400px; margin: 0 auto; } 
        input, select { width: 100%; background: var(--card-bg); border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 4px; font-family: inherit; } 
        .search-container { display: flex; align-items: center; background: var(--card-bg); border: 1px solid var(--border); padding: 2px 15px; width: 100%; flex: 1; max-width: 100%; border-radius: 999px; min-width: 0; } 
        .search-container input { border: none; padding: 8px; box-shadow: none; outline: none; min-width: 0; } 
        
        #logo-container { text-align: center; margin-bottom: 25px; } 
        #logo-display { max-height: 120px; max-width: 100%; object-fit: contain; } 
        
        .header-tienda { display: flex; flex-direction: column; justify-content: center; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 20px; margin-bottom: 20px; gap: 18px;} 
        .header-tienda h2 { margin: 0; font-weight: 400; letter-spacing: 2px; text-transform: uppercase; font-size: 1.2rem; color: var(--accent); } 
        .top-controls { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 560px; }
        
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 10px; } 
        .card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; text-align: center; display: flex; flex-direction: column; border-radius: 8px; position: relative; transition: transform 0.3s, box-shadow 0.3s;} 
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.05); border-color: var(--border); }
       .card-img { width: 100%; height: 220px; object-fit: contain; margin-bottom: 20px; background-color: transparent; border-radius: 4px; } 
        .card h3 { margin: 0 0 15px 0; font-weight: 500; font-size: 1.1rem; text-transform: uppercase; color: var(--primary); } 
        
        .btn-carrito-nav { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); border-radius: 50%; width: 44px; height: 44px; min-width: 44px; padding: 0; display:flex; align-items:center; justify-content:center; position: relative; font-size: 1.05rem;} 
        .badge { position: absolute; top: -5px; right: -5px; background: var(--primary); color: #fff; padding: 2px 6px; font-size: 0.65rem; border-radius: 999px; min-width: 18px; line-height: 14px;} 
        .acciones-compra { display: flex; gap: 10px; margin-top: auto; flex-wrap: wrap; } 
        .input-cantidad { width: 60px; text-align: center; flex-shrink: 0; } 
        .select-variante { margin-bottom: 15px; } 
        
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 15px;} 
        .modal-content { background: var(--card-bg); padding: 40px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); } 
        .form-group { margin-bottom: 20px; } 
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 500;} 
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--border-light); flex-wrap: wrap;} 
        
        .carrito-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--border-light); align-items: center; flex-wrap: wrap; gap: 10px;} 
        .carrito-total { font-size: 1.2rem; font-weight: 500; text-align: right; margin: 25px 0; color: var(--primary); } 
        .checkout-options { background: var(--bg-color); padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; border-radius: 8px;} 
        
        .badge-promo { position: absolute; top: 10px; left: 10px; background: #ef4444; color: white; padding: 4px 8px; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; border-radius: 4px; letter-spacing: 1px; z-index: 10;} 
        .badge-pack { background: #3b82f6; }


        /* ===== MEJORAS CARRITO / UX ===== */
        #toast-agregado {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translateX(-50%) translateY(20px);
            background: var(--primary);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.18);
            z-index: 999999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            text-align: center;
            max-width: calc(100vw - 40px);
        }
        #toast-agregado.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .control-cantidad-carrito {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 3px;
        }
        .control-cantidad-carrito button {
            width: 28px;
            height: 28px;
            padding: 0;
            border-radius: 50%;
            font-size: 0.9rem;
            line-height: 1;
        }
        .control-cantidad-carrito span {
            min-width: 24px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }
        .resumen-confirmacion {
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            font-size: 0.85rem;
            line-height: 1.6;
            color: var(--text-muted);
        }
        .resumen-confirmacion strong { color: var(--text-main); }
        
        @media (max-width: 768px) { 
            body { padding: 14px 12px; }
            #logo-container { margin-bottom: 18px; }
            #logo-display { max-height: 95px; }
            #info-local-comprador { margin-bottom: 24px !important; padding: 12px 14px !important; font-size: 0.8rem !important; }
            .header-tienda { text-align: center; gap: 14px; margin-bottom: 16px; padding-bottom: 16px; } 
            .header-tienda h2 { font-size: 1.45rem; letter-spacing: 4px; }
            .top-controls { gap: 8px; max-width: 100%; }
            .search-container { height: 44px; } 
            .search-container input { font-size: 0.95rem; }
            .btn-carrito-nav { width: 44px; height: 44px; min-width: 44px; font-size: 1rem; }
            .auth-carrito-container { max-width: 100% !important; }
            .filtros-scroll { gap: 10px; margin-bottom: 16px; padding-bottom: 8px; }
            .btn-categoria { padding: 8px 17px; font-size: 0.78rem; }
            .grid-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .card { padding: 10px; border-radius: 9px; }
            .card-img { height: 120px; margin-bottom: 10px; }
            .card h3 { font-size: 0.78rem; line-height: 1.25; margin-bottom: 8px; }
            .select-variante { font-size: 0.72rem; padding: 7px; margin-bottom: 8px; }
            .card p { font-size: 0.75rem !important; }
            .input-cantidad { width: 48px; padding: 8px 4px; }
            .acciones-compra { gap: 6px; flex-wrap: nowrap; } 
            .acciones-compra button { padding: 8px 6px; font-size: 0.62rem; letter-spacing: 0.6px; }
            .badge-promo { top: 7px; left: 7px; font-size: 0.58rem; padding: 3px 6px; }
            .btn-flotante-wsp { width: 54px; height: 54px; right: 18px; bottom: 20px; }
            .modal-content { padding: 20px; } 
            .checkout-options > div[style*="display: flex"] { flex-direction: column; gap: 10px; } 
        }

        @media (min-width: 640px) and (max-width: 768px) {
            .grid-cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (max-width: 360px) {
            .grid-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
            .card { padding: 8px; }
            .card-img { height: 105px; }
            .acciones-compra { flex-direction: column; }
            .input-cantidad { width: 100%; }
        }

        /* ===== PANTALLA DE CARGA ===== */
        #pantalla-carga {
            position: fixed; inset: 0;
            width: 100vw; height: 100vh;
            background-color: #ffffff;
            display: flex; justify-content: center; align-items: center;
            z-index: 999999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
    
        .logo-wrapper {
            position: relative;
            width: 400px; height: 400px;
        }
        .logo-wrapper::before {
            content: "CARGANDO...";
            position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--primary);
            font-size: 1.2rem; font-weight: bold; letter-spacing: 2px;
            z-index: -1;
        }
        .logo-base, .logo-fill {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }
        .logo-base { opacity: 0.15; }
        .logo-fill {
            clip-path: inset(100% 0 0 0);
            animation: cargaLogo 2s ease-in-out forwards;
        }
        @keyframes cargaLogo {
            0% { clip-path: inset(100% 0 0 0); }
            100% { clip-path: inset(0 0 0 0); }
        }

        /* ===== FILTROS DE SUBCATEGORÍAS Y MODO DE VISTA ===== */
        .filtros-subcategorias {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-top: -10px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }
        .filtros-subcategorias::-webkit-scrollbar { display: none; }

        .btn-subcategoria {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 0.76rem;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }
        .btn-subcategoria:hover {
            border-color: var(--accent);
            color: var(--text-main);
        }
        .btn-subcategoria.active {
            background: var(--card-bg);
            color: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .catalogo-toolbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin: 0 0 14px 0;
        }
        .btn-vista {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 13px;
            font-size: 0.74rem;
            letter-spacing: 0.4px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
        }
        .btn-vista:hover {
            border-color: var(--accent);
            color: var(--text-main);
            background: var(--card-hover);
        }
        .btn-vista.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-vista svg {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* El texto visible se controla por JavaScript en formato Título.
           Se anulan los uppercase forzados del diseño anterior. */
        button,
        .btn-categoria,
        .btn-subcategoria,
        .card h3,
        .form-group label,
        .badge-promo,
        .carrito-item span,
        .header-tienda h2 {
            text-transform: none !important;
        }

        @media (max-width: 768px) {
            .filtros-subcategorias { gap: 9px; margin-top: -5px; }
            .btn-subcategoria { padding: 7px 14px; font-size: 0.72rem; }
            .catalogo-toolbar { margin-bottom: 10px; }
            .btn-vista { padding: 8px 10px; font-size: 0.7rem; }
        }



        /* ===== RESPONSIVE FINAL MULTIDISPOSITIVO ===== */
        html { width: 100%; max-width: 100%; overflow-x: hidden; }
        body { width: 100%; max-width: 100%; overflow-x: hidden; min-height: 100svh; }
        img, svg { max-width: 100%; }
        .container { width: min(100%, 1400px); }
        .grid-cards { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: stretch; }
        .card { min-width: 0; overflow: hidden; }
        .card h3 { overflow-wrap: anywhere; hyphens: auto; }
        .card-img { width: 100%; aspect-ratio: 1 / 1; height: auto; max-height: 260px; }
        .filtros-scroll, .filtros-subcategorias { -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; }
        .btn-categoria, .btn-subcategoria { scroll-snap-align: start; }
        .modal-content { width: min(100%, 560px); }
        .catalogo-toolbar { flex-wrap: wrap; }
        .checkout-options input, .checkout-options select { font-size: 16px; }

        @media (min-width: 1200px) {
            body { padding: 28px; }
            .grid-cards { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
            .card-img { max-height: 285px; }
        }

        @media (min-width: 769px) and (max-width: 1199px) {
            body { padding: 22px; }
            .grid-cards { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 18px; }
            .card { padding: 16px; }
            .card-img { max-height: 225px; }
            .modal-content { max-width: 600px; }
        }

        @media (max-width: 768px) {
            body { padding: max(12px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom)); }
            .container { width: 100%; }
            .header-tienda { position: sticky; top: 0; z-index: 50; background: var(--bg-color); padding-top: 8px; }
            .top-controls { display: grid; grid-template-columns: 1fr 44px; width: 100%; }
            .catalogo-toolbar { justify-content: stretch; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
            .btn-vista { justify-content: center; min-height: 42px; }
            .filtros-scroll, .filtros-subcategorias { width: calc(100vw - 24px); margin-left: 0; }
            .modal-overlay { align-items: flex-start; overflow-y: auto; padding: 10px; }
            .modal-content { max-width: 100%; width: 100%; padding: 18px; margin: 10px 0; border-radius: 14px; max-height: none; }
            .modal-actions { display: grid; grid-template-columns: 1fr; }
            .modal-actions button { width: 100%; min-height: 44px; }
            .carrito-item { align-items: flex-start; }
            .carrito-item > div { width: 100%; }
            .carrito-total { text-align: left; width: 100%; }
            #btn-flotante-wsp { right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .grid-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .card-img { max-height: 165px; }
        }

        @media (max-width: 480px) {
            .grid-cards { grid-template-columns: 1fr; gap: 14px; }
            .card { padding: 14px; }
            .card-img { max-height: 230px; }
            .acciones-compra { display: grid; grid-template-columns: 72px 1fr; gap: 8px; }
            .input-cantidad { width: 100%; min-height: 42px; }
            .acciones-compra button { min-height: 42px; font-size: 0.72rem; }
            .control-cantidad-carrito { width: 100%; justify-content: space-between; }
            .checkout-options { padding: 14px; }
            .logo-wrapper { width: min(78vw, 280px); height: min(78vw, 280px); }
        }

        @media (max-width: 340px) {
            body { padding-left: 8px; padding-right: 8px; }
            .filtros-scroll, .filtros-subcategorias { width: calc(100vw - 16px); }
            .btn-categoria, .btn-subcategoria { padding-left: 12px; padding-right: 12px; }
            .card { padding: 12px; }
            .acciones-compra { grid-template-columns: 1fr; }
        }

    </style>
</head>
<body>

    <div id="pantalla-carga">
        <div class="logo-wrapper">
            <img src="https://i.pinimg.com/736x/93/ab/35/93ab3576f2c1c55a0d966cedec575ddc.jpg" class="logo-base" alt="" onerror="this.style.display='none'">
            <img src="https://i.pinimg.com/736x/93/ab/35/93ab3576f2c1c55a0d966cedec575ddc.jpg" class="logo-fill" alt="" onerror="this.style.display='none'">
        </div>
    </div>

    <div id="toast-agregado">Producto agregado al carrito</div>

    <div id="vista-comprador" class="container">
        
        <div id="logo-container" class="hidden"><img id="logo-display" src="" alt="Logo de la Tienda"></div>
        <div id="info-local-comprador" style="background: var(--card-bg); padding: 15px 20px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 30px; font-size: 0.85rem; color: var(--text-muted); display: none; text-align: center; letter-spacing: 0.5px;"></div>

        <div class="header-tienda">
            <h2>Catálogo</h2>
            
            <div class="top-controls">
                <div class="search-container">
                    <input type="text" class="input-busqueda" placeholder="Buscar producto..." autocomplete="off" name="busqueda" onkeyup="window.buscarProductos(this.value)">
                </div>
                <button onclick="window.abrirCarrito()" class="btn-carrito-nav" aria-label="Abrir carrito" title="Carrito">
                    🛒 <span id="badge-carrito" class="badge" style="display: none;">0</span>
                </button>
            </div>
        </div>
        
        <div id="contenedor-categorias" class="filtros-scroll"></div>
        <div id="contenedor-subcategorias" class="filtros-subcategorias hidden"></div>

        <div class="catalogo-toolbar" aria-label="Modo de visualización">
            <button id="btn-vista-agrupada" class="btn-vista active" type="button" onclick="window.cambiarModoVista('agrupada')" title="Ver productos agrupados">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1"/><rect x="3" y="14" width="18" height="6" rx="1"/></svg>
                Agrupada
            </button>
            <button id="btn-vista-separada" class="btn-vista" type="button" onclick="window.cambiarModoVista('separada')" title="Ver cada variante por separado">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                Separada
            </button>
        </div>

        <div id="catalogo-productos" class="grid-cards"><p style="color: var(--text-muted);">Conectando a la base de datos...</p></div>
    </div>

    <button id="btn-flotante-wsp" class="btn-flotante-wsp hidden" onclick="window.contactarWspLocal()" title="Contactar por WhatsApp">
