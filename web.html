    <script type="module">
        // ===== INTEGRACIÓN FIREBASE ACTUALIZADA (MULTI-TENANT) =====
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, getDoc, doc, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDJLS0xvRkdEMGQUPy3a8y76beb0LVukpw",
            authDomain: "pedidos-dba18.firebaseapp.com",
            projectId: "pedidos-dba18",
            storageBucket: "pedidos-dba18.firebasestorage.app",
            messagingSenderId: "361618837437",
            appId: "1:361618837437:web:ec464cb07617c5bdb5ccd4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ESTADO GLOBAL
        let categoriasGlobales = ['General', 'Bebidas', 'Snacks', 'Packs', 'Ofertas'];
        let subcategoriasGlobales = {};
        let categoriaActiva = '';
        let subcategoriaActiva = '';
        let modoVistaCatalogo = 'agrupada';
        let categoriasClientes = [{ nombre: 'Consumidor Final', descuentoGlobal: 0, descuentosCat: {} }];
        let productos = []; 
        let packs = []; 
        let carrito = []; 
        let terminoBusqueda = "";
        const TEMA_TIENDA_PREDETERMINADO = Object.freeze({
            primary:'#5d4037', primaryHover:'#4e342e', accent:'#8d6e63',
            bg:'#f5f5f7', card:'#ffffff', cardHover:'#f9f9f9',
            border:'#e0e0e0', borderLight:'#eeeeee',
            textMain:'#212121', textMuted:'#616161', textDark:'#9e9e9e'
        });
        let configTienda = { logo: '', telefono: '', horaApertura: '09:00', horaCierre: '18:00', diasApertura: { 'check-lu':true, 'check-ma':true, 'check-mi':true, 'check-ju':true, 'check-vi':true }, envioDisponible: false, envioPrecio: 0, apariencia: { ...TEMA_TIENDA_PREDETERMINADO } };

        const colorHexValido = (valor) => /^#[0-9a-fA-F]{6}$/.test(String(valor || ''));
        const normalizarTemaTienda = (tema = {}) => {
            const limpio = {};
            for (const [clave, porDefecto] of Object.entries(TEMA_TIENDA_PREDETERMINADO)) {
                limpio[clave] = colorHexValido(tema?.[clave]) ? tema[clave].toLowerCase() : porDefecto;
            }
            return limpio;
        };
        const aplicarTemaTienda = (tema = {}) => {
            const t = normalizarTemaTienda(tema);
            const root = document.documentElement.style;
            root.setProperty('--primary', t.primary);
            root.setProperty('--primary-hover', t.primaryHover);
            root.setProperty('--accent', t.accent);
            root.setProperty('--bg-color', t.bg);
            root.setProperty('--card-bg', t.card);
            root.setProperty('--card-hover', t.cardHover);
            root.setProperty('--border', t.border);
            root.setProperty('--border-light', t.borderLight);
            root.setProperty('--text-main', t.textMain);
            root.setProperty('--text-muted', t.textMuted);
            root.setProperty('--text-dark', t.textDark);
        };
        let ultimoPedidoConf = null; 

        window.formatearNum = (num) => new Intl.NumberFormat('es-AR', { maximumFractionDigits: 2 }).format(num);
        const generarIdCorto = () => Math.random().toString(36).substring(2, 6).toUpperCase();

        // ===== NORMALIZACIÓN VISUAL DE TEXTOS =====
        window.formatearTextoTitulo = (valor) => {
            const texto = String(valor ?? '').trim().replace(/\s+/g, ' ');
            if(!texto) return '';
            return texto
                .toLocaleLowerCase('es-AR')
                .replace(/(^|[\s.!?¿¡:;,\-\/(])([\p{L}])/gu, (m, prefijo, letra) => prefijo + letra.toLocaleUpperCase('es-AR'));
        };

        const escaparHtml = (valor) => String(valor ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');

        window.normalizarCampoTexto = (el) => {
            if(!el || typeof el.value !== 'string') return;
            el.value = window.formatearTextoTitulo(el.value);
        };

        const aplicarFormatoTextoVisible = (raiz = document.body) => {
            if(!raiz) return;
            const ignorar = new Set(['SCRIPT','STYLE','SVG','PATH']);
            const walker = document.createTreeWalker(raiz, NodeFilter.SHOW_TEXT);
            const nodos = [];
            while(walker.nextNode()) nodos.push(walker.currentNode);

            nodos.forEach(nodo => {
                const padre = nodo.parentElement;
                if(!padre || ignorar.has(padre.tagName)) return;
                const original = nodo.nodeValue;
                if(!original || !/[\p{L}]/u.test(original)) return;
                // No tocar IDs/códigos puros como #AB12.
                if(/^\s*#[A-Z0-9]+\s*$/.test(original)) return;
                const inicial = original.match(/^\s*/)?.[0] || '';
                const final = original.match(/\s*$/)?.[0] || '';
                const centro = original.trim();
                if(!centro) return;
                nodo.nodeValue = inicial + window.formatearTextoTitulo(centro) + final;
            });

            raiz.querySelectorAll('input[placeholder], button[title], [aria-label]').forEach(el => {
                if(el.placeholder) el.placeholder = window.formatearTextoTitulo(el.placeholder);
                if(el.title) el.title = window.formatearTextoTitulo(el.title);
                if(el.getAttribute('aria-label')) el.setAttribute('aria-label', window.formatearTextoTitulo(el.getAttribute('aria-label')));
            });
        };

        const programarFormatoVisible = () => requestAnimationFrame(() => aplicarFormatoTextoVisible(document.body));



        window.mostrarToast = (mensaje) => {
            const toast = document.getElementById('toast-agregado');
            if(!toast) return;
            toast.textContent = window.formatearTextoTitulo(mensaje);
            toast.classList.add('show');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
        };

        window.contarEnCarrito = (idProd, idVar) => carrito.filter(i => i.idProd === idProd && i.idVar === idVar).length;

        window.obtenerStockDisponibleItem = (item) => {
            if(!item) return 0;
            if(item.isPack) return window.calcularStockPack(item.packRef);
            const prod = productos.find(x => x.id === item.idProd);
            return prod && prod.variantes[item.idVar] ? parseInt(prod.variantes[item.idVar].stock) || 0 : 0;
        };

        window.aumentarCantidadCarrito = (idx) => {
            const item = carrito[idx];
            if(!item) return;
            const stockMax = window.obtenerStockDisponibleItem(item);
            const actual = window.contarEnCarrito(item.idProd, item.idVar);
            if(actual >= stockMax) {
                window.mostrarToast(`No hay más stock disponible. Máximo: ${window.formatearNum(stockMax)}`);
                return;
            }
            carrito.push({...item});
            guardarCarritoLocal();
            actualizarBadge();
            window.renderizarCarrito();
        };

        window.disminuirCantidadCarrito = (idx) => {
            const item = carrito[idx];
            if(!item) return;
            const pos = carrito.findIndex(i => i.idProd === item.idProd && i.idVar === item.idVar);
            if(pos >= 0) carrito.splice(pos, 1);
            guardarCarritoLocal();
            actualizarBadge();
            window.renderizarCarrito();
        };

        window.generarResumenConfirmacionHTML = (pedido) => {
            if(!pedido) return '';
            const itemsHTML = pedido.items.map(i => `• ${i.cantidad}x ${i.nombre} (${i.detalle}) - $${window.formatearNum(i.precio * i.cantidad)}`).join('<br>');
            return `
                <strong>Cliente:</strong> ${pedido.nombreCliente} ${pedido.apellidoCliente}<br>
                <strong>Teléfono:</strong> ${pedido.telefono}<br>
                <strong>Entrega:</strong> ${pedido.metodoEntrega} - ${pedido.direccion}<br>
                <strong>Pago:</strong> ${pedido.metodoPago}<br>
                <strong>Pedido:</strong><br>${itemsHTML}<br>
                <strong>Total final:</strong> $${window.formatearNum(pedido.total)}
            `;
        };

        // 1. OBTENER EL ID DEL NEGOCIO DESDE LA URL
        const urlParams = new URLSearchParams(window.location.search);
        const negocioIdURL = urlParams.get('n');
        const SCHEMA_VERSION = 2;
        const CATALOG_PAGE_SIZE = 40;
        let catalogoPagina = 1;
        const carritoStorageKey = () => negocioIdURL ? `carrito_negocio_${negocioIdURL}` : 'carrito_negocio_sin_id';

        const guardarCarritoLocal = () => {
            try {
                localStorage.setItem(carritoStorageKey(), JSON.stringify(carrito.map(item => ({
                    ...item,
                    packRef: undefined
                }))));
            } catch(e) {
                console.warn('No se pudo guardar el carrito localmente:', e);
            }
        };

        const cargarCarritoLocal = () => {
            try {
                const raw = localStorage.getItem(carritoStorageKey());
                if(!raw) return;
                const data = JSON.parse(raw);
                if(!Array.isArray(data)) return;
                carrito = data.map(item => {
                    if(item?.isPack) {
                        const pk = packs.find(x => `pack_${x.id}` === item.idProd || x.id === String(item.idProd || '').replace('pack_', ''));
                        return { ...item, packRef: pk || item.packRef || null };
                    }
                    return item;
                }).filter(item => item && item.idProd && item.idVar);
            } catch(e) {
                console.warn('No se pudo recuperar el carrito local:', e);
                carrito = [];
            }
        };

        const limpiarCarritoLocal = () => {
            try { localStorage.removeItem(carritoStorageKey()); } catch(e) {}
        };


        // CARGA DE DATOS DESDE FIREBASE (FILTRADA)
        const cargarDatosBD = async () => {
            if (!negocioIdURL) {
                document.body.innerHTML = `
                    <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:var(--bg-color); font-family:sans-serif; text-align: center; padding: 20px;">
                        <h2 style="color:var(--primary); font-size:2rem; margin-bottom:10px;">Enlace Inválido</h2>
                        <p style="color:var(--text-muted);">No se especificó ningún negocio en la URL.</p>
                    </div>
                `;
                return;
            }

            try {
                // Configuración propia de la tienda
                const confDoc = await getDoc(doc(db, "configuracion", negocioIdURL));
                if(confDoc.exists()) {
                    configTienda = { ...configTienda, ...confDoc.data() };
                    configTienda.apariencia = normalizarTemaTienda(configTienda.apariencia || {});
                    aplicarTemaTienda(configTienda.apariencia);
                } else {
                    document.body.innerHTML = `
                        <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; background:var(--bg-color); font-family:sans-serif; text-align: center; padding: 20px;">
                            <h2 style="color:var(--primary); font-size:2rem; margin-bottom:10px;">Tienda no encontrada</h2>
                            <p style="color:var(--text-muted);">El negocio al que intentas acceder no existe o no ha sido configurado aún.</p>
                        </div>
                    `;
                    return;
                }

                // Categorías propias
                const catDoc = await getDoc(doc(db, "categorias", negocioIdURL));
                if(catDoc.exists()) {
                    const datosCategorias = catDoc.data();
                    categoriasGlobales = datosCategorias.lista || categoriasGlobales;
                    subcategoriasGlobales = datosCategorias.subcategorias || {};
                }

                // Productos filtrados por negocioId
                const qP = query(collection(db, "productos"), where("negocioId", "==", negocioIdURL));
                const prodSnap = await getDocs(qP);
                productos = prodSnap.docs.map(d => { let obj = d.data(); obj.id = d.id; return obj; }); 

                // Packs filtrados por negocioId
                const qPk = query(collection(db, "packs"), where("negocioId", "==", negocioIdURL));
                const packSnap = await getDocs(qPk);
                packs = packSnap.docs.map(d => { let obj = d.data(); obj.id = d.id; return obj; }); 

                iniciarTiendaUI();
            } catch (e) {
                console.error("Error conectando a Firebase:", e);
                document.getElementById('catalogo-productos').innerHTML = "<p style='color:red;'>Error de conexión. Verifica las reglas de Firestore.</p>";
            } finally {
                setTimeout(() => {
                    const loader = document.getElementById('pantalla-carga');
                    if (loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => loader.style.visibility = 'hidden', 500);
                    }
                }, 1000);
            }
        };

        // LÓGICA UI
        const iniciarTiendaUI = () => {
            const logoCont = document.getElementById('logo-container'); const logoImg = document.getElementById('logo-display');
            if (configTienda.logo && configTienda.logo.trim() !== '') { logoImg.src = configTienda.logo; logoCont.classList.remove('hidden'); }
            
            const btnWsp = document.getElementById('btn-flotante-wsp');
            if(configTienda.telefono) btnWsp.classList.remove('hidden');

            const info = document.getElementById('info-local-comprador'); let html = ''; let diasAbiertos = []; const strDias = { 'check-lu':'Lu', 'check-ma':'Ma', 'check-mi':'Mi', 'check-ju':'Ju', 'check-vi':'Vi', 'check-sa':'Sá', 'check-do':'Do' };
            if(configTienda.diasApertura) Object.entries(configTienda.diasApertura).forEach(([id, c]) => { if(c) diasAbiertos.push(strDias[id]); });
            if(diasAbiertos.length > 0) { const txtDias = diasAbiertos.length === 7 ? "LUN A DOM" : diasAbiertos.join(' - '); const txtEstado = window.estaElLocalAbierto() ? '<span style="color:var(--primary); font-weight:600;">ABIERTO AHORA</span>' : '<span style="color:var(--text-dark);">CERRADO AHORA</span>'; html += `${txtDias} | ${configTienda.horaApertura} a ${configTienda.horaCierre} hs. | ${txtEstado}`; }
            if(configTienda.envioDisponible) html += `<br><span style="font-size:0.75rem; color:var(--text-dark);">TARIFA ENVÍO $${window.formatearNum(configTienda.envioPrecio)}</span>`;
            if(html) { info.innerHTML = html; info.style.display = 'block'; }
            
            cargarCarritoLocal();
            actualizarBadge();
            window.renderizarBotonesCategorias();
            window.renderizarBotonesSubcategorias();
            window.actualizarSelectsClientes();
            window.renderizarCatalogoYStock();

            ['checkout-nombre','checkout-apellido','checkout-direccion'].forEach(id => {
                const campo = document.getElementById(id);
                if(campo && !campo.dataset.formatoTitulo) {
                    campo.dataset.formatoTitulo = '1';
                    campo.addEventListener('blur', () => window.normalizarCampoTexto(campo));
                }
            });
            programarFormatoVisible();
        };

        window.estaElLocalAbierto = () => {
            if(!configTienda.diasApertura || Object.keys(configTienda.diasApertura).length === 0) return true; 
            const ahora = new Date(); const diaSemana = ahora.getDay(); const horaActual = ahora.toTimeString().substring(0, 5); 
            const diasMapa = { 0: 'check-do', 1: 'check-lu', 2: 'check-ma', 3: 'check-mi', 4: 'check-ju', 5: 'check-vi', 6: 'check-sa' };
            if(!configTienda.diasApertura[diasMapa[diaSemana]]) return false;
            return horaActual >= configTienda.horaApertura && horaActual < configTienda.horaCierre;
        };
        window.contactarWspLocal = () => { if(!configTienda.telefono) return; const numeroLimpio = configTienda.telefono.replace(/[^0-9]/g, ''); window.open(`https://wa.me/${numeroLimpio}?text=${encodeURIComponent("Hola, me comunico desde la tienda en línea.")}`, '_blank'); };
        window.toggleDireccion = () => { const m = document.getElementById('metodo-entrega').value; const c = document.getElementById('caja-direccion'); if (m === 'Envio') { if(!configTienda.envioDisponible) { document.getElementById('metodo-entrega').value = 'Retiro'; c.style.display = 'none'; return; } c.style.display = 'block'; document.getElementById('aviso-envio').textContent = `Coste adicional $${window.formatearNum(configTienda.envioPrecio)}`; } else { c.style.display = 'none'; } window.renderizarCarrito(); };
        window.buscarProductos = (texto) => { terminoBusqueda = String(texto || '').toLocaleLowerCase('es-AR').trim(); catalogoPagina = 1; window.renderizarCatalogoYStock(); };
        window.verificarVigenciaOferta = (fechaLimite) => { if(!fechaLimite) return false; const hoy = new Date(); hoy.setHours(0,0,0,0); const limite = new Date(fechaLimite + 'T00:00:00'); return hoy <= limite; };
        window.calcularStockPack = (pack) => { let stocksDisponibles = []; pack.items.forEach(it => { const p = productos.find(x => x.id === it.idProd); if(p && p.variantes[it.idVar]) stocksDisponibles.push(Math.floor(p.variantes[it.idVar].stock / it.cantidad)); else stocksDisponibles.push(0); }); return stocksDisponibles.length > 0 ? Math.min(...stocksDisponibles) : 0; };
        const obtenerSubcategoriasCategoria = (categoria) => {
            if(!categoria || categoria === 'Packs') return [];

            const configuradas = Array.isArray(subcategoriasGlobales?.[categoria])
                ? subcategoriasGlobales[categoria]
                : [];

            const detectadas = [];
            productos
                .filter(p => categoria === 'Ofertas' || p.categoria === categoria)
                .forEach(p => {
                    Object.values(p.variantes || {}).forEach(v => {
                        if(categoria === 'Ofertas' && !(v.precioOferta && window.verificarVigenciaOferta(v.fechaLimiteOferta))) return;
                        const sub = String(v.subcategoria || '').trim();
                        if(sub && !detectadas.some(x => x.toLocaleLowerCase('es-AR') === sub.toLocaleLowerCase('es-AR'))) detectadas.push(sub);
                    });
                });

            const total = [...configuradas];
            detectadas.forEach(sub => {
                if(!total.some(x => String(x).toLocaleLowerCase('es-AR') === sub.toLocaleLowerCase('es-AR'))) total.push(sub);
            });

            return total;
        };

        window.renderizarBotonesCategorias = () => {
            const cont = document.getElementById('contenedor-categorias');
            if(!cont) return;

            cont.innerHTML = `<button class="btn-categoria ${categoriaActiva === '' ? 'active' : ''}" onclick="window.filtrarPorCategoria('')">${window.formatearTextoTitulo('Todos')}</button>`;
            categoriasGlobales.forEach(cat => {
                const valorSeguro = encodeURIComponent(cat);
                cont.innerHTML += `<button class="btn-categoria ${categoriaActiva === cat ? 'active' : ''}" onclick="window.filtrarPorCategoria(decodeURIComponent('${valorSeguro}'))">${escaparHtml(window.formatearTextoTitulo(cat))}</button>`;
            });
            programarFormatoVisible();
        };

        window.renderizarBotonesSubcategorias = () => {
            const cont = document.getElementById('contenedor-subcategorias');
            if(!cont) return;

            const subs = obtenerSubcategoriasCategoria(categoriaActiva);
            if(!categoriaActiva || categoriaActiva === 'Packs' || subs.length === 0) {
                cont.innerHTML = '';
                cont.classList.add('hidden');
                subcategoriaActiva = '';
                return;
            }

            cont.classList.remove('hidden');
            cont.innerHTML = `<button class="btn-subcategoria ${subcategoriaActiva === '' ? 'active' : ''}" onclick="window.filtrarPorSubcategoria('')">${window.formatearTextoTitulo('Todas')}</button>`;

            subs.forEach(sub => {
                const valorSeguro = encodeURIComponent(sub);
                cont.innerHTML += `<button class="btn-subcategoria ${subcategoriaActiva === sub ? 'active' : ''}" onclick="window.filtrarPorSubcategoria(decodeURIComponent('${valorSeguro}'))">${escaparHtml(window.formatearTextoTitulo(sub))}</button>`;
            });
            programarFormatoVisible();
        };

        window.filtrarPorCategoria = (cat) => {
            categoriaActiva = cat;
            subcategoriaActiva = '';
            catalogoPagina = 1;
            window.renderizarBotonesCategorias();
            window.renderizarBotonesSubcategorias();
            catalogoPagina = 1;
            window.renderizarCatalogoYStock();
        };

        window.filtrarPorSubcategoria = (sub) => {
            subcategoriaActiva = sub;
            catalogoPagina = 1;
            window.renderizarBotonesSubcategorias();
            catalogoPagina = 1;
            window.renderizarCatalogoYStock();
        };

        window.cambiarModoVista = (modo) => {
            if(!['agrupada','separada'].includes(modo)) return;
            modoVistaCatalogo = modo;
            catalogoPagina = 1;

            const bAgr = document.getElementById('btn-vista-agrupada');
            const bSep = document.getElementById('btn-vista-separada');
            if(bAgr) bAgr.classList.toggle('active', modo === 'agrupada');
            if(bSep) bSep.classList.toggle('active', modo === 'separada');

            catalogoPagina = 1;
            window.renderizarCatalogoYStock();
        };

        window.actualizarSelectsClientes = () => {
            const selCheckout = document.getElementById('checkout-tipo-cliente');
            const opciones = categoriasClientes.map((c, i) =>
                `<option value="${i}">${escaparHtml(window.formatearTextoTitulo(c.nombre))} (-${c.descuentoGlobal}% ${window.formatearTextoTitulo('Global')})</option>`
            ).join('');
            if(selCheckout) selCheckout.innerHTML = opciones;
            window.renderizarCarrito();
        };

        window.cambiarVarianteUI = (id, sel) => {
            const o = sel.options[sel.selectedIndex];
            if(!o) return;
            const stk = parseInt(o.getAttribute('data-stock')) || 0;
            const isOferta = o.getAttribute('data-esoferta') === 'true';
            const pFinal = o.getAttribute('data-precio');
            const pOrig = o.getAttribute('data-precio-orig');
            const imagenVariante = o.getAttribute('data-imagen') || '';
            const imgEl = document.getElementById(`img-prod-${id}`);

            if(imgEl && imagenVariante) imgEl.src = imagenVariante;

            const priceHtml = isOferta
                ? `<span style="text-decoration:line-through; color:var(--text-dark); font-size:0.85rem; margin-right:8px;">$${window.formatearNum(pOrig)}</span>$${window.formatearNum(pFinal)}`
                : `$${window.formatearNum(pFinal)}`;

            const precio = document.getElementById(`precio-display-${id}`);
            if(precio) precio.innerHTML = priceHtml;

            const badge = document.getElementById(`badge-oferta-${id}`);
            if(badge) badge.style.display = isOferta ? 'inline-block' : 'none';

            const b = document.getElementById(`btn-add-${id}`);
            const i = document.getElementById(`cant-${id}`);
            const stock = document.getElementById(`stock-disp-${id}`);

            if(stock) stock.textContent = `${window.formatearTextoTitulo('Disponibilidad')}: ${window.formatearNum(stk)}`;
            if(i) i.max = stk;

            if(b && i) {
                if(stk <= 0) {
                    b.disabled = true;
                    b.textContent = window.formatearTextoTitulo('Agotado');
                    i.disabled = true;
                } else {
                    b.disabled = false;
                    b.textContent = window.formatearTextoTitulo('Agregar');
                    i.disabled = false;
                }
            }
            programarFormatoVisible();
        };

        const varianteCumpleFiltros = (p, v) => {
            if(categoriaActiva === 'Ofertas' && !(v.precioOferta && window.verificarVigenciaOferta(v.fechaLimiteOferta))) return false;
            if(subcategoriaActiva && String(v.subcategoria || '').toLocaleLowerCase('es-AR') !== subcategoriaActiva.toLocaleLowerCase('es-AR')) return false;

            if(terminoBusqueda) {
                const bolsa = [
                    p.nombre,
                    p.categoria,
                    v.detalle,
                    v.subcategoria
                ].map(x => String(x || '').toLocaleLowerCase('es-AR')).join(' ');
                if(!bolsa.includes(terminoBusqueda)) return false;
            }
            return true;
        };

        const productoCumpleCategoria = (p) => {
            if(categoriaActiva === '') return true;
            if(categoriaActiva === 'Ofertas') {
                return Object.values(p.variantes || {}).some(v => v.precioOferta && window.verificarVigenciaOferta(v.fechaLimiteOferta));
            }
            return p.categoria === categoriaActiva;
        };

        const crearTarjetaVarianteSeparada = (p, vId, v) => {
            const stock = Number(v.stock) || 0;
            const esOferta = v.precioOferta && window.verificarVigenciaOferta(v.fechaLimiteOferta);
            const precioFinal = esOferta ? v.precioOferta : v.precio;
            const img = v.imagen || 'https://via.placeholder.com/300x200?text=IMG';
            const idSeguro = `${p.id}_${vId}`.replace(/[^a-zA-Z0-9_-]/g, '_');
            const nombre = window.formatearTextoTitulo(p.nombre);
            const detalle = window.formatearTextoTitulo(v.detalle || 'Única');
            const sub = window.formatearTextoTitulo(v.subcategoria || '');
            const badge = esOferta ? `<div class="badge-promo">${window.formatearTextoTitulo('Oferta')}</div>` : '';
            const precioHTML = esOferta
                ? `<span style="text-decoration:line-through; color:var(--text-dark); font-size:0.85rem; margin-right:8px;">$${window.formatearNum(v.precio)}</span>$${window.formatearNum(precioFinal)}`
                : `$${window.formatearNum(precioFinal)}`;

            return `<div class="card">
                ${badge}
                <img src="${escaparHtml(img)}" class="card-img" onerror="this.src='https://via.placeholder.com/300x200?text=X'">
                <h3>${escaparHtml(nombre)}</h3>
                <div style="font-size:0.82rem; color:var(--text-muted); margin:-5px 0 5px 0;">${escaparHtml(detalle)}</div>
                ${sub ? `<div style="font-size:0.7rem; color:var(--accent); margin-bottom:12px;">${escaparHtml(sub)}</div>` : ''}
                <p style="font-size:1.3rem; font-weight:600; margin:0 0 5px 0; color:var(--primary);">${precioHTML}</p>
                <p style="font-size:0.7rem; color:var(--text-muted); margin-bottom:20px; letter-spacing:1px;">${window.formatearTextoTitulo('Disponibilidad')}: ${window.formatearNum(stock)}</p>
                <div class="acciones-compra">
                    <input type="number" id="cant-sep-${idSeguro}" class="input-cantidad" value="1" min="1" max="${stock}" ${stock===0?'disabled':''}>
                    <button style="flex-grow:1;" onclick="window.agregarVarianteSeparada('${encodeURIComponent(p.id)}','${encodeURIComponent(vId)}','cant-sep-${idSeguro}')" ${stock===0?'disabled':''}>${window.formatearTextoTitulo(stock===0?'Agotado':'Agregar')}</button>
                </div>
            </div>`;
        };

        window.agregarVarianteSeparada = (prodEnc, varEnc, inputId) => {
            const prodId = decodeURIComponent(prodEnc);
            const vId = decodeURIComponent(varEnc);
            const p = productos.find(x => x.id === prodId);
            if(!p || !p.variantes || !p.variantes[vId]) {
                window.mostrarToast(window.formatearTextoTitulo('No se encontró el producto seleccionado.'));
                return;
            }

            const v = p.variantes[vId];
            const input = document.getElementById(inputId);
            const cantidad = Math.max(1, parseInt(input?.value) || 1);
            const stockMax = parseInt(v.stock) || 0;
            const actualInCart = window.contarEnCarrito(prodId, vId);
            const precioFinal = v.precioOferta && window.verificarVigenciaOferta(v.fechaLimiteOferta) ? v.precioOferta : v.precio;

            if(stockMax <= 0 || actualInCart + cantidad > stockMax) {
                window.mostrarToast(window.formatearTextoTitulo(`Stock insuficiente. Disponible: ${Math.max(0, stockMax - actualInCart)} unidades.`));
                return;
            }

            for(let i = 0; i < cantidad; i++) {
                carrito.push({
                    idProd: prodId,
                    idVar: vId,
                    nombre: p.nombre,
                    detalle: v.detalle,
                    categoria: p.categoria || 'General',
                    subcategoria: v.subcategoria || '',
                    precio: precioFinal,
                    precioLista: Number(v.precio) || 0,
                    precioOfertaAplicado: v.precioOferta && window.verificarVigenciaOferta(v.fechaLimiteOferta) ? Number(v.precioOferta) || 0 : null,
                    imagen: v.imagen || '',
                    skuInterno: `${prodId}|${vId}`,
                    schemaVersion: SCHEMA_VERSION,
                    isPack: false
                });
            }

            if(input) input.value = 1;
            guardarCarritoLocal();
            actualizarBadge();
            window.renderizarCarrito();
            window.mostrarToast(window.formatearTextoTitulo(`${p.nombre} agregado al carrito.`));
        };

        window.cargarMasCatalogo = () => {
            catalogoPagina += 1;
            window.renderizarCatalogoYStock();
        };

        window.renderizarCatalogoYStock = () => {
            const c = document.getElementById('catalogo-productos');
            if(!c) return;

            const productosCategoria = productos.filter(productoCumpleCategoria);
            const tarjetas = [];

            if(modoVistaCatalogo === 'agrupada') {
                productosCategoria.forEach(p => {
                    let variantes = Object.entries(p.variantes || {}).filter(([vId, v]) => varianteCumpleFiltros(p, v));
                    if(variantes.length === 0) return;

                    let opciones = '';
                    variantes.forEach(([vId, v]) => {
                        const esOfertaVar = v.precioOferta && window.verificarVigenciaOferta(v.fechaLimiteOferta);
                        const precio = esOfertaVar ? v.precioOferta : v.precio;
                        const img = v.imagen || '';
                        const detalle = window.formatearTextoTitulo(v.detalle || 'Única');
                        const sub = window.formatearTextoTitulo(v.subcategoria || '');
                        const textoOpcion = sub ? `${detalle} · ${sub}` : detalle;

                        opciones += `<option
                            value="${escaparHtml(vId)}"
                            data-precio="${precio}"
                            data-precio-orig="${v.precio}"
                            data-esoferta="${esOfertaVar ? 'true' : 'false'}"
                            data-stock="${Number(v.stock)||0}"
                            data-imagen="${escaparHtml(img)}">${escaparHtml(textoOpcion)}</option>`;
                    });

                    const primera = variantes[0][1];
                    const imgInicial = primera.imagen || 'https://via.placeholder.com/300x200?text=IMG';
                    const esOfertaInicial = primera.precioOferta && window.verificarVigenciaOferta(primera.fechaLimiteOferta);
                    const badgeHTML = `<div id="badge-oferta-${p.id}" class="badge-promo" style="display:${esOfertaInicial ? 'inline-block' : 'none'};">${window.formatearTextoTitulo('Oferta')}</div>`;
                    const precioDisplay = esOfertaInicial ? primera.precioOferta : primera.precio;
                    const priceHtml = esOfertaInicial
                        ? `<span style="text-decoration:line-through; color:var(--text-dark); font-size:0.85rem; margin-right:8px;">$${window.formatearNum(primera.precio)}</span>$${window.formatearNum(precioDisplay)}`
                        : `$${window.formatearNum(precioDisplay)}`;

                    tarjetas.push(`<div class="card">
                        ${badgeHTML}
                        <img id="img-prod-${p.id}" src="${escaparHtml(imgInicial)}" class="card-img" onerror="this.src='https://via.placeholder.com/300x200?text=X'">
                        <h3>${escaparHtml(window.formatearTextoTitulo(p.nombre))}</h3>
                        <select id="sel-var-${p.id}" class="select-variante" onchange="window.cambiarVarianteUI('${p.id}', this)">${opciones}</select>
                        <p id="precio-display-${p.id}" style="font-size:1.3rem; font-weight:600; margin:0 0 5px 0; color:var(--primary);">${priceHtml}</p>
                        <p id="stock-disp-${p.id}" style="font-size:0.7rem; color:var(--text-muted); margin-bottom:20px; letter-spacing:1px;">${window.formatearTextoTitulo('Disponibilidad')}: ${window.formatearNum(Number(primera.stock)||0)}</p>
                        <div class="acciones-compra">
                            <input type="number" id="cant-${p.id}" class="input-cantidad" value="1" min="1" max="${Number(primera.stock)||0}" ${(Number(primera.stock)||0)===0?'disabled':''}>
                            <button id="btn-add-${p.id}" style="flex-grow:1;" onclick="window.agregarAlCarrito('${p.id}')" ${(Number(primera.stock)||0)===0?'disabled':''}>${window.formatearTextoTitulo((Number(primera.stock)||0)===0?'Agotado':'Agregar')}</button>
                        </div>
                    </div>`);
                });
            } else {
                productosCategoria.forEach(p => {
                    Object.entries(p.variantes || {})
                        .filter(([vId, v]) => varianteCumpleFiltros(p, v))
                        .forEach(([vId, v]) => tarjetas.push(crearTarjetaVarianteSeparada(p, vId, v)));
                });
            }

            const packsVisibles = packs.filter(pk => {
                if(!(categoriaActiva === '' || categoriaActiva === 'Packs')) return false;
                if(subcategoriaActiva) return false;
                if(!terminoBusqueda) return true;
                return String(pk.nombre || '').toLocaleLowerCase('es-AR').includes(terminoBusqueda);
            });

            packsVisibles.forEach(pk => {
                const img = pk.imagen || 'https://via.placeholder.com/300x200?text=PACK';
                const stockCombo = window.calcularStockPack(pk);
                const badgeHTML = `<div class="badge-promo badge-pack">${window.formatearTextoTitulo('Pack')}</div>`;
                let descItems = '<div style="font-size:0.7rem; color:var(--text-muted); margin-bottom:10px; min-height:30px;">';
                (pk.items || []).forEach(i => {
                    descItems += `${escaparHtml(window.formatearTextoTitulo(i.nombre))} (${escaparHtml(window.formatearTextoTitulo(i.detalle))}) x${i.cantidad} | `;
                });
                if((pk.items || []).length) descItems = descItems.substring(0, descItems.length - 3);
                descItems += '</div>';

                tarjetas.push(`<div class="card">
                    ${badgeHTML}
                    <img src="${escaparHtml(img)}" class="card-img" onerror="this.src='https://via.placeholder.com/300x200?text=X'">
                    <h3>${escaparHtml(window.formatearTextoTitulo(pk.nombre))}</h3>
                    ${descItems}
                    <p style="font-size:1.3rem; font-weight:600; margin:0 0 5px 0; color:var(--primary);">$${window.formatearNum(pk.precio)}</p>
                    <p style="font-size:0.7rem; color:var(--text-muted); margin-bottom:20px; letter-spacing:1px;">${window.formatearTextoTitulo('Combos disponibles')}: ${window.formatearNum(stockCombo)}</p>
                    <div class="acciones-compra">
                        <input type="number" id="cant-pack_${pk.id}" class="input-cantidad" value="1" min="1" max="${stockCombo}" ${stockCombo===0?'disabled':''}>
                        <button id="btn-add-pack_${pk.id}" style="flex-grow:1;" onclick="window.agregarAlCarrito('pack_${pk.id}')" ${stockCombo===0?'disabled':''}>${window.formatearTextoTitulo(stockCombo===0?'Agotado':'Agregar combo')}</button>
                    </div>
                </div>`);
            });

            if(tarjetas.length === 0) {
                c.innerHTML = `<p style="color:var(--text-muted)">${window.formatearTextoTitulo('No se encontraron productos.')}</p>`;
                programarFormatoVisible();
                return;
            }

            const limite = catalogoPagina * CATALOG_PAGE_SIZE;
            const visibles = tarjetas.slice(0, limite);
            const botonMas = tarjetas.length > limite
                ? `<div style="grid-column:1/-1; display:flex; justify-content:center; margin:8px 0 18px;"><button type="button" class="secondary" onclick="window.cargarMasCatalogo()">${window.formatearTextoTitulo('Cargar más productos')}</button></div>`
                : '';
            c.innerHTML = visibles.join('') + botonMas;
            programarFormatoVisible();
        };


        window.abrirCarrito = () => { document.getElementById('modal-carrito').classList.remove('hidden'); document.getElementById('carrito-vista-lista').classList.remove('hidden'); document.getElementById('carrito-vista-exito').classList.add('hidden'); };
        window.cerrarCarrito = () => document.getElementById('modal-carrito').classList.add('hidden');
        window.cerrarCarritoExito = () => { window.vaciarCarrito(); window.cerrarCarrito(); }

        window.agregarAlCarrito = (id) => {
            if(id.startsWith('pack_')) {
                let pkId = id.replace('pack_', '');
                const pk = packs.find(x => x.id === pkId);
                if(!pk) { window.mostrarToast("No se encontró el pack seleccionado."); return; }

                const c = parseInt(document.getElementById(`cant-${id}`).value) || 1;
                const stockMax = window.calcularStockPack(pk);
                const actualInCart = window.contarEnCarrito(id, 'pack');

                if(stockMax <= 0) {
                    window.mostrarToast("Este combo está agotado.");
                    return;
                }
                if(c < 1) {
                    window.mostrarToast("La cantidad mínima es 1.");
                    return;
                }
                if(actualInCart + c > stockMax) {
                    window.mostrarToast(`Stock insuficiente. Disponible: ${window.formatearNum(stockMax - actualInCart)} combo(s).`);
                    return;
                }

                for(let i=0; i<c; i++) carrito.push({ idProd: id, idVar: 'pack', nombre: pk.nombre, detalle: 'Combo Promocional', categoria: 'Packs', subcategoria: '', precio: Number(pk.precio)||0, precioLista: Number(pk.precio)||0, precioOfertaAplicado: null, imagen: pk.imagen || '', skuInterno: id, schemaVersion: SCHEMA_VERSION, isPack: true, packRef: pk });
                window.mostrarToast(`${pk.nombre} agregado al carrito`);
            } else {
                const p = productos.find(x => x.id === id);
                if(!p) { window.mostrarToast("No se encontró el producto seleccionado."); return; }

                const vId = document.getElementById(`sel-var-${id}`).value;
                const v = p.variantes[vId];
                const c = parseInt(document.getElementById(`cant-${id}`).value) || 1;
                const actualInCart = window.contarEnCarrito(id, vId);
                const stockMax = parseInt(v.stock) || 0;
                let prFinal = v.precioOferta && window.verificarVigenciaOferta(v.fechaLimiteOferta) ? v.precioOferta : v.precio;

                if(stockMax <= 0) {
                    window.mostrarToast("Este producto está agotado.");
                    return;
                }
                if(c < 1) {
                    window.mostrarToast("La cantidad mínima es 1.");
                    return;
                }
                if(actualInCart + c > stockMax) {
                    window.mostrarToast(`Stock insuficiente. Disponible: ${window.formatearNum(stockMax - actualInCart)} unidad(es).`);
                    return;
                }

                for(let i=0; i<c; i++) carrito.push({ idProd: id, idVar: vId, nombre: p.nombre, detalle: v.detalle, categoria: p.categoria || 'General', subcategoria: v.subcategoria || '', precio: prFinal, precioLista: Number(v.precio)||0, precioOfertaAplicado: v.precioOferta && window.verificarVigenciaOferta(v.fechaLimiteOferta) ? Number(v.precioOferta)||0 : null, imagen: v.imagen || '', skuInterno: `${id}|${vId}`, schemaVersion: SCHEMA_VERSION, isPack: false });
                window.mostrarToast(`${p.nombre} agregado al carrito`);
            }
            guardarCarritoLocal();
            actualizarBadge();
            window.renderizarCarrito();
            document.getElementById(`cant-${id}`).value = 1;
        };
        window.quitarDelCarrito = (idx) => { carrito.splice(idx, 1); guardarCarritoLocal(); actualizarBadge(); window.renderizarCarrito(); };
        window.vaciarCarrito = () => { carrito = []; limpiarCarritoLocal(); actualizarBadge(); window.renderizarCarrito(); };
        function actualizarBadge() { const b = document.getElementById('badge-carrito'); b.textContent = carrito.length; b.style.display = carrito.length > 0 ? 'block' : 'none'; }

        window.renderizarCarrito = () => {
            const l = document.getElementById('lista-carrito'); const ts = document.getElementById('total-carrito'); const bc = document.getElementById('btn-comprar'); if(!l) return;
            const selectCliente = document.getElementById('checkout-tipo-cliente'); const clientIndex = selectCliente ? parseInt(selectCliente.value) : 0;
            const perfilCli = categoriasClientes[clientIndex] || categoriasClientes[0];
            l.innerHTML = ''; let subtotalBruto = 0; let descuentoMonto = 0;
            
            if (carrito.length === 0) { 
                l.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; text-transform:uppercase; letter-spacing:1px;">Vacío</p>'; 
                bc.disabled = true; document.getElementById('checkout-form').style.display = 'none'; document.getElementById('btn-vaciar').style.display = 'none'; 
            } else {
                bc.disabled = false; document.getElementById('checkout-form').style.display = 'block'; document.getElementById('btn-vaciar').style.display = 'inline-block';
                const cV = {}; 
                carrito.forEach((p, idx) => { 
                    const u = p.idProd+'_'+p.idVar; if(!cV[u]) cV[u] = {...p, c:0, idx}; cV[u].c++; 
                    let cat = 'General'; if(!p.isPack) { const prodRef = productos.find(x => x.id === p.idProd); cat = prodRef ? prodRef.categoria : 'General'; } else { cat = 'Packs'; }
                    const descPct = (perfilCli.descuentosCat && perfilCli.descuentosCat[cat] !== undefined) ? perfilCli.descuentosCat[cat] : perfilCli.descuentoGlobal;
                    subtotalBruto += p.precio; descuentoMonto += p.precio * (descPct / 100);
                });
                Object.values(cV).forEach(i => {
                    l.innerHTML += `
                        <div class="carrito-item">
                            <div>
                                <span style="color:var(--text-main); font-size:0.95rem; text-transform:uppercase; font-weight:500;">${i.nombre}</span><br>
                                <span style="color:var(--text-muted); font-size:0.75rem; text-transform:uppercase;">${i.detalle}</span>
                            </div>
                            <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap; justify-content:flex-end;">
                                <div class="control-cantidad-carrito">
                                    <button type="button" onclick="window.disminuirCantidadCarrito(${i.idx})">−</button>
                                    <span>${i.c}</span>
                                    <button type="button" onclick="window.aumentarCantidadCarrito(${i.idx})">+</button>
                                </div>
                                <span style="color:var(--text-main); font-size:0.95rem; font-weight:500; min-width:80px; text-align:right;">$${window.formatearNum(i.precio*i.c)}</span>
                                <button onclick="window.quitarDelCarrito(${i.idx})" class="danger" style="padding:4px 8px; border-radius:4px;">X</button>
                            </div>
                        </div>`;
                });
            } 
            let total = subtotalBruto - descuentoMonto;
            if (descuentoMonto > 0) { l.innerHTML += `<div style="display:flex; justify-content:space-between; align-items:center; padding: 10px 0;"><span style="color:var(--accent); font-size:0.85rem; font-weight:500;">Ahorro Cliente (${perfilCli.nombre})</span><span style="color:var(--accent); font-weight:600;">-$${window.formatearNum(descuentoMonto)}</span></div>`; }
            if(document.getElementById('metodo-entrega') && document.getElementById('metodo-entrega').value === 'Envio' && configTienda.envioDisponible && carrito.length > 0) { total += configTienda.envioPrecio; }
            ts.textContent = window.formatearNum(total); ts.setAttribute('data-descuentomonto', descuentoMonto);
        };


        window.validarStockAntesDeConfirmar = async (itemsPedido) => {
            const faltantes = [];
            const productosActualizados = new Map();

            const obtenerProductoActualizado = async (idProd) => {
                if(productosActualizados.has(idProd)) return productosActualizados.get(idProd);

                const snap = await getDoc(doc(db, "productos", idProd));
                if(!snap.exists()) {
                    productosActualizados.set(idProd, null);
                    return null;
                }

                const producto = snap.data();
                producto.id = snap.id;
                productosActualizados.set(idProd, producto);
                return producto;
            };

            for (const item of itemsPedido) {
                if (!item.isPack) {
                    const prodActual = await obtenerProductoActualizado(item.idProd);
                    const varianteActual = prodActual && prodActual.variantes ? prodActual.variantes[item.idVar] : null;
                    const stockActual = varianteActual ? parseInt(varianteActual.stock) || 0 : 0;

                    if (!varianteActual || stockActual < item.cantidad) {
                        faltantes.push({
                            nombre: `${item.nombre} (${item.detalle})`,
                            pedido: item.cantidad,
                            disponible: stockActual
                        });
                    }
                } else {
                    const pkId = item.idProd.replace('pack_', '');
                    const packActual = packs.find(x => x.id === pkId);

                    if (!packActual || !packActual.items || packActual.items.length === 0) {
                        faltantes.push({
                            nombre: `${item.nombre} (${item.detalle})`,
                            pedido: item.cantidad,
                            disponible: 0
                        });
                        continue;
                    }

                    let combosDisponibles = Infinity;
                    for (const pkItem of packActual.items) {
                        const prodActual = await obtenerProductoActualizado(pkItem.idProd);
                        const varianteActual = prodActual && prodActual.variantes ? prodActual.variantes[pkItem.idVar] : null;
                        const stockActual = varianteActual ? parseInt(varianteActual.stock) || 0 : 0;
                        const posiblesCombos = Math.floor(stockActual / pkItem.cantidad);
                        combosDisponibles = Math.min(combosDisponibles, posiblesCombos);
                    }

                    if (!Number.isFinite(combosDisponibles)) combosDisponibles = 0;
                    if (combosDisponibles < item.cantidad) {
                        faltantes.push({
                            nombre: `${item.nombre} (${item.detalle})`,
                            pedido: item.cantidad,
                            disponible: combosDisponibles
                        });
                    }
                }
            }

            if (faltantes.length > 0) {
                const detalle = faltantes.map(f => `• ${f.nombre}\n  Pedido: ${f.pedido} | Disponible: ${f.disponible}`).join('\n\n');
                alert(`No se puede confirmar el pedido porque no hay stock suficiente:\n\n${detalle}\n\nModificá las cantidades del carrito para continuar.`);
                return false;
            }

            return true;
        };

        const construirResumenCarritoActual = () => {
            const cV = {};
            carrito.forEach(item => {
                const key = `${item.idProd}_${item.idVar}`;
                if(!cV[key]) cV[key] = {...item, cantidad: 0};
                cV[key].cantidad += 1;
            });
            return Object.values(cV);
        };

        const validarDatosCheckout = ({nombre, apellido, telefono, metodoEntrega, direccion}) => {
            const errores = [];
            const telLimpio = String(telefono || '').replace(/[^0-9]/g, '');
            if(String(nombre || '').trim().length < 2) errores.push('El nombre debe tener al menos 2 caracteres.');
            if(String(apellido || '').trim().length < 2) errores.push('El apellido debe tener al menos 2 caracteres.');
            if(telLimpio.length < 8) errores.push('El teléfono debe tener al menos 8 números.');
            if(metodoEntrega === 'Envio' && String(direccion || '').trim().length < 8) errores.push('La dirección de envío debe tener al menos 8 caracteres.');
            return errores;
        };

        const revalidarYRecalcularPedido = async (resumenCarrito, perfilCli, metodoEntrega) => {
            const items = [];
            let subtotalBruto = 0;
            let descuentoMonto = 0;
            const faltantes = [];
            const cacheProductos = new Map();
            const cachePacks = new Map();

            const leerProducto = async (idProd) => {
                if(cacheProductos.has(idProd)) return cacheProductos.get(idProd);
                const snap = await getDoc(doc(db, 'productos', idProd));
                const data = snap.exists() ? {...snap.data(), id: snap.id} : null;
                cacheProductos.set(idProd, data);
                return data;
            };

            const leerPack = async (packId) => {
                if(cachePacks.has(packId)) return cachePacks.get(packId);
                const snap = await getDoc(doc(db, 'packs', packId));
                const data = snap.exists() ? {...snap.data(), id: snap.id} : null;
                cachePacks.set(packId, data);
                return data;
            };

            for(const item of resumenCarrito) {
                if(!item.isPack) {
                    const prod = await leerProducto(item.idProd);
                    const variante = prod?.variantes?.[item.idVar];
                    const stockActual = Number(variante?.stock) || 0;
                    if(!prod || prod.negocioId !== negocioIdURL || !variante || stockActual < item.cantidad) {
                        faltantes.push({ nombre: `${item.nombre} (${item.detalle})`, pedido: item.cantidad, disponible: stockActual });
                        continue;
                    }

                    const esOferta = variante.precioOferta && window.verificarVigenciaOferta(variante.fechaLimiteOferta);
                    const precioFinal = Number(esOferta ? variante.precioOferta : variante.precio) || 0;
                    const categoria = prod.categoria || 'General';
                    const descPct = (perfilCli.descuentosCat && perfilCli.descuentosCat[categoria] !== undefined) ? Number(perfilCli.descuentosCat[categoria]) || 0 : Number(perfilCli.descuentoGlobal) || 0;
                    const brutoLinea = precioFinal * item.cantidad;
                    subtotalBruto += brutoLinea;
                    descuentoMonto += brutoLinea * (descPct / 100);

                    items.push({
                        idProd: item.idProd,
                        idVar: item.idVar,
                        nombre: prod.nombre || item.nombre,
                        detalle: variante.detalle || item.detalle,
                        categoria,
                        subcategoria: variante.subcategoria || '',
                        precio: precioFinal,
                        precioLista: Number(variante.precio) || 0,
                        precioOfertaAplicado: esOferta ? Number(variante.precioOferta) || 0 : null,
                        imagen: variante.imagen || '',
                        skuInterno: `${item.idProd}|${item.idVar}`,
                        cantidad: item.cantidad,
                        isPack: false,
                        schemaVersion: SCHEMA_VERSION
                    });
                } else {
                    const pkId = String(item.idProd || '').replace('pack_', '');
                    const pack = await leerPack(pkId);
                    if(!pack || pack.negocioId !== negocioIdURL || !Array.isArray(pack.items) || !pack.items.length) {
                        faltantes.push({ nombre: item.nombre || 'Pack', pedido: item.cantidad, disponible: 0 });
                        continue;
                    }

                    let combosDisponibles = Infinity;
                    for(const comp of pack.items) {
                        const prod = await leerProducto(comp.idProd);
                        const variante = prod?.variantes?.[comp.idVar];
                        const stockActual = Number(variante?.stock) || 0;
                        combosDisponibles = Math.min(combosDisponibles, Math.floor(stockActual / (Number(comp.cantidad) || 1)));
                    }
                    if(!Number.isFinite(combosDisponibles)) combosDisponibles = 0;
                    if(combosDisponibles < item.cantidad) {
                        faltantes.push({ nombre: pack.nombre || item.nombre || 'Pack', pedido: item.cantidad, disponible: combosDisponibles });
                        continue;
                    }

                    const precioFinal = Number(pack.precio) || 0;
                    const categoria = 'Packs';
                    const descPct = (perfilCli.descuentosCat && perfilCli.descuentosCat[categoria] !== undefined) ? Number(perfilCli.descuentosCat[categoria]) || 0 : Number(perfilCli.descuentoGlobal) || 0;
                    const brutoLinea = precioFinal * item.cantidad;
                    subtotalBruto += brutoLinea;
                    descuentoMonto += brutoLinea * (descPct / 100);

                    items.push({
                        idProd: `pack_${pkId}`,
                        idVar: 'pack',
                        nombre: pack.nombre || item.nombre,
                        detalle: 'Combo Promocional',
                        categoria,
                        subcategoria: '',
                        precio: precioFinal,
                        precioLista: precioFinal,
                        precioOfertaAplicado: null,
                        imagen: pack.imagen || '',
                        skuInterno: `pack_${pkId}`,
                        cantidad: item.cantidad,
                        isPack: true,
                        schemaVersion: SCHEMA_VERSION
                    });
                }
            }

            if(faltantes.length > 0) return { ok: false, faltantes };
            const costoEnvio = (metodoEntrega === 'Envio' && configTienda.envioDisponible) ? Number(configTienda.envioPrecio) || 0 : 0;
            const total = Math.max(0, (subtotalBruto - descuentoMonto) + costoEnvio);
            return { ok: true, items, subtotalBruto, descuentoMonto, costoEnvio, total };
        };

        window.enviarWhatsapp = () => {
            if(!configTienda.telefono) { alert("El local aún no configuró su número de contacto."); return; }
            const numeroLimpio = configTienda.telefono.replace(/[^0-9]/g, '');
            
            let texto = `Hola! Me comunico desde la tienda en línea.`;
            
            if (ultimoPedidoConf) {
                texto = `Hola! Acabo de generar el pedido *#${ultimoPedidoConf.idCorto}*.\n\n`;
                texto += `*Datos del cliente*\n`;
                texto += `Nombre: ${ultimoPedidoConf.nombreCliente} ${ultimoPedidoConf.apellidoCliente}\n`;
                texto += `Teléfono: ${ultimoPedidoConf.telefono}\n\n`;
                texto += `*Entrega*\n`;
                texto += `Modalidad: ${ultimoPedidoConf.metodoEntrega}\n`;
                texto += `Dirección/Retiro: ${ultimoPedidoConf.direccion}\n\n`;
                texto += `*Pago*\n`;
                texto += `Método: ${ultimoPedidoConf.metodoPago}\n`;
                if(ultimoPedidoConf.tipoCliente) texto += `Tipo de cliente: ${ultimoPedidoConf.tipoCliente}\n`;
                if(ultimoPedidoConf.descuentoMonto > 0) texto += `Descuento aplicado: -$${window.formatearNum(ultimoPedidoConf.descuentoMonto)}\n`;
                if(ultimoPedidoConf.costoEnvio > 0) texto += `Costo de envío: $${window.formatearNum(ultimoPedidoConf.costoEnvio)}\n`;
                texto += `\n*Resumen del pedido*\n`;
                ultimoPedidoConf.items.forEach(i => {
                    texto += `- ${i.cantidad}x ${i.nombre} (${i.detalle}): $${window.formatearNum(i.precio * i.cantidad)}\n`;
                });
                texto += `\n*Total final: $${window.formatearNum(ultimoPedidoConf.total)}*\n\n`;
                texto += `Por favor coordinemos la confirmación, el pago y la entrega.`;
            }
            
            window.open(`https://wa.me/${numeroLimpio}?text=${encodeURIComponent(texto)}`, '_blank');
        };

        window.finalizarCompra = async () => {
            if (carrito.length === 0) return;
            const campoNombre = document.getElementById('checkout-nombre');
            const campoApellido = document.getElementById('checkout-apellido');
            const campoDireccion = document.getElementById('checkout-direccion');
            window.normalizarCampoTexto(campoNombre);
            window.normalizarCampoTexto(campoApellido);
            if(campoDireccion) window.normalizarCampoTexto(campoDireccion);

            const n = String(campoNombre.value || '').trim();
            const a = String(campoApellido.value || '').trim();
            const t = String(document.getElementById('checkout-telefono').value || '').trim();
            const mE = document.getElementById('metodo-entrega').value;
            const d = String(document.getElementById('checkout-direccion').value || '').trim();

            const erroresCheckout = validarDatosCheckout({ nombre: n, apellido: a, telefono: t, metodoEntrega: mE, direccion: d });
            if(erroresCheckout.length) {
                alert(erroresCheckout.join('\n'));
                return;
            }
            if(!window.estaElLocalAbierto()) alert("El local se encuentra cerrado. El pedido quedará en cola.");

            const btnComprar = document.getElementById('btn-comprar');
            const textoOriginalComprar = btnComprar.textContent;
            btnComprar.disabled = true;
            btnComprar.textContent = 'Procesando…';
            try {
                const resumenCarrito = construirResumenCarritoActual();
                if(!resumenCarrito.length) return;

                const selCliente = document.getElementById('checkout-tipo-cliente');
                const clientIndex = selCliente ? parseInt(selCliente.value) : 0;
                const perfilCli = categoriasClientes[clientIndex] || categoriasClientes[0];
                const recalculo = await revalidarYRecalcularPedido(resumenCarrito, perfilCli, mE);

                if(!recalculo.ok) {
                    const detalle = recalculo.faltantes.map(f => `• ${f.nombre}\n  Pedido: ${f.pedido} | Disponible: ${f.disponible}`).join('\n\n');
                    alert(`No se puede confirmar el pedido porque no hay stock suficiente:\n\n${detalle}\n\nModificá las cantidades del carrito para continuar.`);
                    return;
                }

                if(recalculo.total <= 0) {
                    alert('El total del pedido debe ser mayor a cero.');
                    return;
                }

                const tipoClienteTxt = selCliente ? selCliente.options[selCliente.selectedIndex].text.split(' (')[0] : '';
                const idC = generarIdCorto();

                let nuevoPedido = {
                    schemaVersion: SCHEMA_VERSION,
                    idCorto: idC,
                    fecha: serverTimestamp(),
                    fechaClienteISO: new Date().toISOString(),
                    nombreCliente: n,
                    apellidoCliente: a,
                    telefono: t,
                    direccion: mE === 'Envio' ? d : 'Retiro en local',
                    metodoPago: document.getElementById('metodo-pago').value,
                    metodoEntrega: mE,
                    estadoPago: false,
                    estadoEntrega: false,
                    estadoPedido: 'pendiente',
                    estadoGeneral: 'pendiente',
                    stockDescontado: false,
                    total: recalculo.total,
                    subtotalBruto: recalculo.subtotalBruto,
                    costoEnvio: recalculo.costoEnvio,
                    descuentoMonto: recalculo.descuentoMonto,
                    tipoCliente: tipoClienteTxt,
                    items: recalculo.items,
                    negocioId: negocioIdURL
                };

                await addDoc(collection(db, "pedidos"), nuevoPedido);

                ultimoPedidoConf = { ...nuevoPedido, fecha: new Date() };

                window.renderizarCatalogoYStock();
                document.getElementById('exito-id').textContent = `#${idC}`;
                document.getElementById('resumen-confirmacion').innerHTML = window.generarResumenConfirmacionHTML(ultimoPedidoConf);
                document.getElementById('carrito-vista-lista').classList.add('hidden');
                document.getElementById('carrito-vista-exito').classList.remove('hidden');
                document.getElementById('checkout-nombre').value = "";
                document.getElementById('checkout-apellido').value = "";
                document.getElementById('checkout-telefono').value = "";
                document.getElementById('checkout-direccion').value = "";
                carrito = [];
                limpiarCarritoLocal();
                actualizarBadge();
            } catch (e) {
                console.error(e);
                alert("Hubo un error al procesar el pedido. Intentá nuevamente.");
            } finally {
                btnComprar.disabled = false;
                btnComprar.textContent = textoOriginalComprar;
            }
        };

        window.onload = () => {
            aplicarFormatoTextoVisible(document.body);
            cargarDatosBD();
        };
    </script>
</body>
